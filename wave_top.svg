<svg width="900" height="60" viewBox="0 0 900 60" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="25%" stop-color="#0369a1"/>
      <stop offset="50%" stop-color="#00b4d8"/>
      <stop offset="75%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1" to="1" dur="3s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-100%" width="120%" height="300%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- soft glow wave -->
  <path d="M0,30 C150,10 300,50 450,30 C600,10 750,50 900,30" fill="none" stroke="url(#g)" stroke-width="3" filter="url(#glow)" opacity="0.8">
    <animate attributeName="d" dur="6s" repeatCount="indefinite"
      values="M0,30 C150,10 300,50 450,30 C600,10 750,50 900,30;
              M0,30 C150,50 300,10 450,30 C600,50 750,10 900,30;
              M0,30 C150,10 300,50 450,30 C600,10 750,50 900,30"/>
  </path>

  <!-- thin crisp wave -->
  <path d="M0,30 C150,50 300,10 450,30 C600,50 750,10 900,30" fill="none" stroke="url(#g)" stroke-width="1.2" opacity="0.9">
    <animate attributeName="d" dur="6s" repeatCount="indefinite"
      values="M0,30 C150,50 300,10 450,30 C600,50 750,10 900,30;
              M0,30 C150,10 300,50 450,30 C600,10 750,50 900,30;
              M0,30 C150,50 300,10 450,30 C600,50 750,10 900,30"/>
  </path>

  <!-- travelling shine -->
  <rect x="0" y="29" width="900" height="2" fill="url(#shine)" opacity="0.7"/>

  <!-- sparkles -->
  <circle cx="150" cy="30" r="2" fill="#7dd3fc"><animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite"/></circle>
  <circle cx="450" cy="30" r="2.5" fill="#ffffff"><animate attributeName="opacity" values="1;0.2;1" dur="2.4s" repeatCount="indefinite"/></circle>
  <circle cx="750" cy="30" r="2" fill="#7dd3fc"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.8s" repeatCount="indefinite"/></circle>
</svg>
