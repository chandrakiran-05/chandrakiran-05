<svg width="800" height="60" viewBox="0 0 800 60" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .line { stroke: #00b4d8; stroke-width: 1; opacity: 0.5; }
      .paw { fill: #00b4d8; }
      .p1 { animation: fadeup 2s ease-in-out infinite; }
      .p2 { animation: fadeup 2s ease-in-out 0.3s infinite; }
      .p3 { animation: fadeup 2s ease-in-out 0.6s infinite; }
      .p4 { animation: fadeup 2s ease-in-out 0.9s infinite; }
      .p5 { animation: fadeup 2s ease-in-out 1.2s infinite; }
      @keyframes fadeup {
        0%   { opacity: 0.2; transform: translateY(3px); }
        50%  { opacity: 1;   transform: translateY(-3px); }
        100% { opacity: 0.2; transform: translateY(3px); }
      }
    </style>
  </defs>
  <!-- Left line -->
  <line x1="20" y1="30" x2="310" y2="30" class="line"/>
  <!-- Right line -->
  <line x1="490" y1="30" x2="780" y2="30" class="line"/>

  <!-- Paw 1 -->
  <g class="p1" transform="translate(318,18)">
    <ellipse cx="8" cy="14" rx="7" ry="9" class="paw"/>
    <ellipse cx="1"  cy="5"  rx="4" ry="5" class="paw"/>
    <ellipse cx="8"  cy="2"  rx="4" ry="5" class="paw"/>
    <ellipse cx="15" cy="5"  rx="4" ry="5" class="paw"/>
  </g>
  <!-- Paw 2 -->
  <g class="p2" transform="translate(348,18)">
    <ellipse cx="8" cy="14" rx="7" ry="9" class="paw"/>
    <ellipse cx="1"  cy="5"  rx="4" ry="5" class="paw"/>
    <ellipse cx="8"  cy="2"  rx="4" ry="5" class="paw"/>
    <ellipse cx="15" cy="5"  rx="4" ry="5" class="paw"/>
  </g>
  <!-- Paw 3 — center -->
  <g class="p3" transform="translate(390,14) scale(1.2)">
    <ellipse cx="8" cy="14" rx="7" ry="9" class="paw"/>
    <ellipse cx="1"  cy="5"  rx="4" ry="5" class="paw"/>
    <ellipse cx="8"  cy="2"  rx="4" ry="5" class="paw"/>
    <ellipse cx="15" cy="5"  rx="4" ry="5" class="paw"/>
  </g>
  <!-- Paw 4 -->
  <g class="p4" transform="translate(432,18)">
    <ellipse cx="8" cy="14" rx="7" ry="9" class="paw"/>
    <ellipse cx="1"  cy="5"  rx="4" ry="5" class="paw"/>
    <ellipse cx="8"  cy="2"  rx="4" ry="5" class="paw"/>
    <ellipse cx="15" cy="5"  rx="4" ry="5" class="paw"/>
  </g>
  <!-- Paw 5 -->
  <g class="p5" transform="translate(462,18)">
    <ellipse cx="8" cy="14" rx="7" ry="9" class="paw"/>
    <ellipse cx="1"  cy="5"  rx="4" ry="5" class="paw"/>
    <ellipse cx="8"  cy="2"  rx="4" ry="5" class="paw"/>
    <ellipse cx="15" cy="5"  rx="4" ry="5" class="paw"/>
  </g>
</svg>
