<svg width="800" height="70" viewBox="0 0 800 70" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00b4d8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00b4d8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00b4d8" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="pawGrad" cx="35%" cy="25%" r="80%">
      <stop offset="0%" stop-color="#8fe3f5"/>
      <stop offset="55%" stop-color="#00b4d8"/>
      <stop offset="100%" stop-color="#0090ad"/>
    </radialGradient>

    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Recognizable paw print: big rounded pad + 4 fanned toe beans -->
    <symbol id="pawShape" viewBox="0 0 28 24">
      <ellipse cx="14"   cy="17.3" rx="7.6" ry="6"   fill="url(#pawGrad)"/>
      <ellipse cx="3.6"  cy="10.2" rx="3.1" ry="4"   fill="url(#pawGrad)"/>
      <ellipse cx="10.3" cy="5.4"  rx="3.3" ry="4.3" fill="url(#pawGrad)"/>
      <ellipse cx="17.7" cy="5.4"  rx="3.3" ry="4.3" fill="url(#pawGrad)"/>
      <ellipse cx="24.4" cy="10.2" rx="3.1" ry="4"   fill="url(#pawGrad)"/>
    </symbol>

    <style>
      .line {
        stroke: url(#lineGrad);
        stroke-width: 1.4;
        stroke-dasharray: 300;
        stroke-dashoffset: 300;
        animation: draw 2.6s ease-out forwards;
      }
      .line-r { animation-delay: 0.15s; }

      @keyframes draw {
        to { stroke-dashoffset: 0; }
      }

      .step {
        filter: url(#glow);
        opacity: 0;
        transform-box: fill-box;
        transform-origin: 50% 100%;
        animation: walk 3.2s cubic-bezier(.45,0,.55,1) infinite;
      }
      .step1 { animation-delay: 0s; }
      .step2 { animation-delay: 0.28s; }
      .step3 { animation-delay: 0.56s; }
      .step4 { animation-delay: 0.84s; }
      .step5 { animation-delay: 1.12s; }

      @keyframes walk {
        0%   { opacity: 0;    transform: translateY(6px) scale(0.7) rotate(-6deg); }
        12%  { opacity: 1;    transform: translateY(-4px) scale(1.08) rotate(3deg); }
        24%  { opacity: 0.95; transform: translateY(0px) scale(1) rotate(0deg); }
        70%  { opacity: 0.85; transform: translateY(0px) scale(1) rotate(0deg); }
        88%  { opacity: 0;    transform: translateY(4px) scale(0.85) rotate(-3deg); }
        100% { opacity: 0;    transform: translateY(4px) scale(0.85) rotate(-3deg); }
      }

      .pulseCenter {
        animation: walk 3.2s cubic-bezier(.45,0,.55,1) infinite, glowPulse 3.2s ease-in-out infinite;
        animation-delay: 0.56s, 0.56s;
      }
      @keyframes glowPulse {
        0%, 100% { filter: url(#glow); }
        50% { filter: url(#glow) brightness(1.3); }
      }

      .spark {
        fill: #ffffff;
        opacity: 0;
        animation: twinkle 3.2s ease-in-out infinite;
      }
      @keyframes twinkle {
        0%, 20% { opacity: 0; }
        30% { opacity: 1; }
        45%, 100% { opacity: 0; }
      }
    </style>
  </defs>

  <line x1="15" y1="35" x2="290" y2="35" class="line"/>
  <line x1="510" y1="35" x2="785" y2="35" class="line line-r"/>

  <!-- 5 paws, each ~22 wide x ~19 tall (28:24 ratio), spaced along the gap -->
  <use href="#pawShape" class="step step1" x="298" y="20" width="22" height="19"/>
  <use href="#pawShape" class="step step2" x="335" y="20" width="22" height="19"/>
  <use href="#pawShape" class="step step3 pulseCenter" x="376" y="16" width="26" height="22.5"/>
  <use href="#pawShape" class="step step4" x="417" y="20" width="22" height="19"/>
  <use href="#pawShape" class="step step5" x="454" y="20" width="22" height="19"/>

  <circle class="spark" cx="394" cy="14" r="1.6"/>
  <circle class="spark" cx="402" cy="22" r="1.1"/>
  <circle class="spark" cx="386" cy="24" r="1.3"/>
</svg>
